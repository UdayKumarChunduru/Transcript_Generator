name: Cloud Transcriber

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Pixeldrain Link (e.g., https://pixeldrain.com/u/xxxxxx)'
        required: true
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest
    
    container:
      image: archlinux:latest

    steps:
      - name: Install System Dependencies via Pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm whisper-cpp ffmpeg curl

      - name: Download Ultimate Model (ggml-large-v3.bin)
        run: |
          curl -L -o ggml-large-v3.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin

      - name: Fetch Video Asset from Pixeldrain API
        run: |
          RAW_INPUT="${{ inputs.video_url }}"
          
          # Extracts the alphanumeric File ID block from the input URL
          FILE_ID=$(echo "$RAW_INPUT" | sed 's|.*/u/||; s|.*/file/||; s|.*/d/||')
          
          echo "Targeting Pixeldrain ID: $FILE_ID"
          
          # Creates dedicated working paths
          mkdir -p "./downloads"
          
          # Executes direct streaming pull using Pixeldrain's file delivery API endpoint
          cd downloads
          curl -L -O -J "https://pixeldrain.com/api/file/$FILE_ID"
          cd ..

      - name: Auto-Detect Downloaded Video Filename
        run: |
          # Locate the file that curl generated inside the downloads folder
          TARGET_FILE=$(ls ./downloads/*.mp4 ./downloads/*.mkv ./downloads/*.avi ./downloads/*.webm 2>/dev/null | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Critical Error: Pixeldrain API failed to yield the video stream."
            exit 1
          fi
          
          RAW_FILENAME=$(basename "$TARGET_FILE")
          
          echo "Discovered Media Target: $RAW_FILENAME"
          echo "FULL_PATH=$TARGET_FILE" >> $GITHUB_ENV
          echo "FILENAME=$RAW_FILENAME" >> $GITHUB_ENV

      - name: Extract & Enhance Audio (AI Denoise Filters)
        run: |
          FULL_PATH="${{ env.FULL_PATH }}"
          RAW_NAME="${{ env.FILENAME }}"
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "Restoring and cleaning audio frequencies for $BASE_NAME..."
          ffmpeg -y -fflags +genpts -i "$FULL_PATH" -vn -ar 16000 -ac 1 -c:a pcm_s16le \
          -af "afftdn=nf=-25,highpass=f=80,lowpass=f=7500" "audio_ready.wav" -loglevel error

      - name: Run High-Accuracy Transcription (Large-V3)
        run: |
          RAW_NAME="${{ env.FILENAME }}"
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "Running Whisper large-v3 cloud processing for $BASE_NAME..."
          whisper-cli -m ggml-large-v3.bin -f audio_ready.wav -of "$BASE_NAME" -l en -osrt -t 2

      - name: Upload SRT Subtitle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-srt-output
          path: "*.srt"
